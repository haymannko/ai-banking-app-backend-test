

name: Build Docker Images

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: camera_detect
            context: ./camera_detect/api_endpoint
            dockerfile: ./camera_detect/api_endpoint/Dockerfile
            image: camera-api
          - name: licence_ocr_rest
            context: ./licence_ocr/api_endpoint
            dockerfile: ./licence_ocr/api_endpoint/Dockerfile
            image: licence-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image only
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: ${{ matrix.service.image }}:latest
